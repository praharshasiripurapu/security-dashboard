# prometheus.yml
# Prometheus configuration for SecurityDash

global:
  scrape_interval:     15s   # How often to scrape targets
  evaluation_interval: 15s   # How often to evaluate rules
  scrape_timeout:      10s

# Alertmanager configuration (optional — uncomment if you set up Alertmanager)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['localhost:9093']

# Load alerting rules
rule_files:
  - "alert_rules.yml"

# Scrape configurations
scrape_configs:

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape the SecurityDash FastAPI app
  - job_name: 'securitydash'
    static_configs:
      - targets: ['securitydash:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s      # scrape more frequently for real-time feel

  # Optional: scrape node_exporter for host-level metrics
  # - job_name: 'node_exporter'
  #   static_configs:
  #     - targets: ['localhost:9100']
